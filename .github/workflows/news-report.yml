name: Global News Report

on:
  schedule:
    # 每4小时 (北京时间 08:00 / 12:00 / 16:00 / 20:00 / 00:00 / 04:00)
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run news report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python news_report.py

      - name: Persist state
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add news_state.json
          git diff --cached --quiet || git commit -m "chore: update news state"
          git pull --rebase && git push
