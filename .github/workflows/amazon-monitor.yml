name: Amazon Monitor

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Amazon monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python amazon_monitor.py
      - name: Commit state
        run: |
          git config user.name "bot"
          git config user.email "bot@amazon-monitor"
          git add amazon_state.json 2>/dev/null || true
          git diff --staged --quiet || (git commit -m "update state" && git push) || true
